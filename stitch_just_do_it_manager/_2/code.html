<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet"></head><body class="bg-background font-body-lg text-on-surface"><main class="min-h-screen flex flex-col"><div class="flex flex-col w-full h-full min-h-screen items-center justify-center p-4 relative overflow-hidden bg-background font-body-lg text-on-surface" dir="rtl">
<!-- Ambient Background Elements -->
<div class="absolute inset-0 pointer-events-none z-0 overflow-hidden">
<div class="absolute top-[-20%] right-[-10%] w-[60vw] h-[60vw] rounded-full bg-primary/5 blur-[120px]"></div>
<div class="absolute bottom-[-20%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-secondary-container/5 blur-[100px]"></div>
</div>
<!-- Main Content Container -->
<div class="relative z-10 w-full max-w-md flex flex-col items-center">
<!-- Logo Header -->
<div class="mb-12 flex flex-col items-center justify-center w-full">
<img alt="JEST DOET Logo" class="w-24 h-24 rounded-xl object-contain mb-6 shadow-2xl shadow-primary/10" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBcWvfD1R97rJ2BU6AcSxb8lYoPfdArU9974DBiLfe-AFtIK4AKEiElk0lF-UGVuR8vui71F6JgKjdAPvd_N4mMtn6J4k4hX_-mmxKR7j2ZXPL3xMb2xv88zOSkiRgUU92pfpQCCPf6g7qUkNx8T7P95Rg-HhhzzYK7slwJMEOjvo7HdsMP0qOpiJyY5GAPbwj6dex-k0y2rDoCJFRuy1cL2BUH_vmxYj1QwitimyLPziSZ12PylcynnA">
<h1 class="font-display-lg text-headline-lg text-on-background text-center tracking-tight mb-2">

            </h1>
<p class="text-on-surface-variant text-body-lg text-center">
                مرحباً بك في منصة المهام الفاخرة
            </p>
</div>
<!-- Signup Form -->
<form class="w-full bg-surface-container/50 backdrop-blur-xl p-8 rounded-2xl shadow-2xl relative">
<div class="absolute inset-0 border border-outline-variant/30 rounded-2xl pointer-events-none"></div>
<!-- Glowing accent edge -->
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-1/3 h-[1px] bg-gradient-to-r from-transparent via-primary/50 to-transparent"></div>
<div class="space-y-6">
<!-- Name Field -->
<div class="group relative">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2 transition-colors group-focus-within:text-primary" for="name">الاسم</label>
<div class="relative">
<span class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors material-symbols-outlined text-lg">person</span>
<input class="w-full bg-surface-container-low text-on-surface font-body-lg rounded-lg py-4 pr-12 pl-4 focus:outline-none transition-all duration-300 placeholder:text-on-surface-variant/50 border border-transparent focus:border-primary/50 focus:bg-surface-container hover:bg-surface-container" id="name" name="name" placeholder="الاسم الكامل" required="" type="text">
</div>
</div>
<!-- Email Field -->
<div class="group relative">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2 transition-colors group-focus-within:text-primary" for="email">الايميل</label>
<div class="relative">
<span class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors material-symbols-outlined text-lg">mail</span>
<input class="w-full text-left bg-surface-container-low text-on-surface font-body-lg rounded-lg py-4 pl-4 pr-12 focus:outline-none transition-all duration-300 placeholder:text-on-surface-variant/50 border border-transparent focus:border-primary/50 focus:bg-surface-container hover:bg-surface-container" dir="ltr" id="email" name="email" placeholder="name@company.com" required="" type="email">
</div>
</div>

<div class="group relative">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2 transition-colors group-focus-within:text-primary" for="password">كلمة المرور</label>
<div class="relative">
<span class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors material-symbols-outlined text-lg">lock</span>
<input class="w-full text-left bg-surface-container-low text-on-surface font-body-lg rounded-lg py-4 pl-4 pr-12 focus:outline-none transition-all duration-300 placeholder:text-on-surface-variant/50 border border-transparent focus:border-primary/50 focus:bg-surface-container hover:bg-surface-container" dir="ltr" id="password" name="password" placeholder="••••••••" required="" type="password">

</button>
</div>
</div>
</div>
<!-- Submit Button -->
<button class="w-full mt-10 bg-primary text-on-primary font-title-md py-4 rounded-lg flex items-center justify-center gap-2 transition-all duration-300 hover:bg-primary-container hover:shadow-[0_0_20px_rgba(0,229,255,0.3)] active:scale-[0.98] relative overflow-hidden group" type="submit">
<span class="relative z-10 font-semibold tracking-wide">تسجيل حساب جديد</span>
<span class="material-symbols-outlined relative z-10 text-xl transition-transform group-hover:-translate-x-1" dir="ltr">arrow_forward</span>
<div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-out"></div>
</button>
</form>
<!-- Footer -->
<div class="mt-8 text-center font-body-lg text-on-surface-variant">
<span>لديك حساب بالفعل؟</span>
<a class="text-primary hover:text-primary-container ml-1 transition-colors font-medium border-b border-primary/30 hover:border-primary pb-0.5" href="#">
                سجل الان
            </a>
</div>
</div>
</div>
<script>
    function togglePassword() {
        const passwordInput = document.getElementById('password');
        const toggleIcon = document.getElementById('toggle-icon');
        
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            toggleIcon.textContent = 'visibility_off';
        } else {
            passwordInput.type = 'password';
            toggleIcon.textContent = 'visibility';
        }
    }
</script></main></body></html>
