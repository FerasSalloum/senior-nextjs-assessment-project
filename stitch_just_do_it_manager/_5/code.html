<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet"></head><body class="bg-background font-body-lg text-on-surface"><main class="min-h-screen flex flex-col"><div class="flex flex-col w-full items-center justify-center min-h-[calc(100vh-80px)] p-6 relative overflow-hidden">
<!-- Ambient Background -->
<div class="absolute inset-0 pointer-events-none z-0">
<div class="absolute top-1/4 -right-1/4 w-[800px] h-[800px] bg-primary/5 rounded-full blur-[120px] mix-blend-screen opacity-50"></div>
<div class="absolute -bottom-1/4 -left-1/4 w-[600px] h-[600px] bg-secondary-container/10 rounded-full blur-[100px] mix-blend-screen opacity-40"></div>
</div>
<!-- Login Container -->
<div class="w-full max-w-[480px] bg-surface-container/60 backdrop-blur-2xl rounded-2xl shadow-2xl p-10 relative z-10 flex flex-col items-center border border-outline-variant/30 transition-transform duration-500 hover:shadow-primary/5">
<!-- Logo -->
<div class="w-24 h-24 mb-10 rounded-xl overflow-hidden shadow-lg bg-surface flex items-center justify-center p-2 relative group">
<div class="absolute inset-0 bg-gradient-to-br from-primary/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
<img alt="JEST DOET Logo" class="w-full h-full object-contain mix-blend-screen opacity-90 transition-transform duration-700 group-hover:scale-105" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBcWvfD1R97rJ2BU6AcSxb8lYoPfdArU9974DBiLfe-AFtIK4AKEiElk0lF-UGVuR8vui71F6JgKjdAPvd_N4mMtn6J4k4hX_-mmxKR7j2ZXPL3xMb2xv88zOSkiRgUU92pfpQCCPf6g7qUkNx8T7P95Rg-HhhzzYK7slwJMEOjvo7HdsMP0qOpiJyY5GAPbwj6dex-k0y2rDoCJFRuy1cL2BUH_vmxYj1QwitimyLPziSZ12PylcynnA">
</div>
<!-- Typography -->
<h1 class="text-display-lg text-on-surface mb-2 tracking-tight text-center">تسجيل الدخول</h1>
<p class="text-body-lg text-on-surface-variant mb-10 text-center font-light">مرحباً بك مجدداً، يرجى إدخال بياناتك</p>
<!-- Form -->
<form class="w-full flex flex-col gap-6" onsubmit="event.preventDefault();">
<!-- Email Input -->
<div class="relative group">
<input class="w-full bg-surface-container-high/50 text-on-surface text-body-lg px-5 py-4 rounded-xl outline-none focus:bg-surface-container-highest transition-all duration-300 peer placeholder-transparent border border-transparent focus:border-primary/50 shadow-inner" id="email" placeholder="الايميل" required="" type="email">
<label class="absolute right-5 top-4 text-body-lg text-on-surface-variant transition-all duration-300 peer-focus:-top-3 peer-focus:text-label-caps peer-focus:text-primary peer-focus:bg-surface-container px-1 peer-valid:-top-3 peer-valid:text-label-caps peer-valid:text-primary peer-valid:bg-surface-container pointer-events-none" for="email">
                    الايميل
                </label>
<span class="material-symbols-outlined absolute left-4 top-4 text-on-surface-variant group-focus-within:text-primary transition-colors duration-300">mail</span>
</div>
<!-- Password Input -->
<div class="relative group">
<input class="w-full bg-surface-container-high/50 text-on-surface text-body-lg px-5 py-4 rounded-xl outline-none focus:bg-surface-container-highest transition-all duration-300 peer placeholder-transparent border border-transparent focus:border-primary/50 shadow-inner" id="password" placeholder="كلمة المرور" required="" type="password">
<label class="absolute right-5 top-4 text-body-lg text-on-surface-variant transition-all duration-300 peer-focus:-top-3 peer-focus:text-label-caps peer-focus:text-primary peer-focus:bg-surface-container px-1 peer-valid:-top-3 peer-valid:text-label-caps peer-valid:text-primary peer-valid:bg-surface-container pointer-events-none" for="password">
                    كلمة المرور
                </label>
<button class="absolute left-4 top-4 text-on-surface-variant hover:text-primary transition-colors duration-300 focus:outline-none" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="visibility-icon">visibility_off</span>
</button>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-start w-full -mt-2">
<a class="text-body-sm text-primary/80 hover:text-primary transition-colors duration-200" href="#">نسيت كلمة المرور؟</a>
</div>
<!-- Submit Button -->
<button class="w-full mt-4 bg-primary text-on-primary py-4 rounded-xl font-headline-lg-mobile tracking-wide hover:bg-primary-container transition-all duration-300 transform active:scale-[0.98] shadow-lg shadow-primary/20 relative overflow-hidden group" type="submit">
<span class="relative z-10 flex items-center justify-center gap-2">

                    <span class="material-symbols-outlined text-[20px] transition-transform duration-300 group-hover:-translate-x-1">arrow_back</span>
</span>
<div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-out"></div>
</button>
</form>
<!-- Footer -->
<div class="mt-10 pt-6 border-t border-outline-variant/30 w-full text-center">
<p class="text-body-sm text-on-surface-variant">
                ليس لديك حساب؟؟ 
                <a class="text-primary font-title-md hover:underline decoration-primary/50 underline-offset-4 transition-all duration-200 mr-2" href="#">انشاء حسابك الان</a>
</p>
</div>
</div>
</div>
<script>
    function togglePassword() {
        const passwordInput = document.getElementById('password');
        const visibilityIcon = document.getElementById('visibility-icon');
        
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            visibilityIcon.textContent = 'visibility';
        } else {
            passwordInput.type = 'password';
            visibilityIcon.textContent = 'visibility_off';
        }
    }
</script></main></body></html>
